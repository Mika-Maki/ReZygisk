name: Watch CSOLoader merge
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check upstream PR
        id: check
        run: |
          MERGED=$(curl -s https://api.github.com/repos/ThePedroo/CSOLoader/pulls/3 | python3 -c 'import json,sys; print(json.load(sys.stdin).get("merged", False))')
          echo "merged=$MERGED" >> "$GITHUB_OUTPUT"

      - name: Bump submodule to upstream main
        if: steps.check.outputs.merged == 'true'
        run: |
          git submodule update --init loader/src/external/csoloader
          git -C loader/src/external/csoloader fetch origin main
          git -C loader/src/external/csoloader checkout origin/main
          sed -i 's#https://github.com/Mika-Maki/CSOLoader#https://github.com/ThePedroo/CSOLoader#' .gitmodules
          git add .gitmodules loader/src/external/csoloader
          git -c user.name='rez-bot' -c user.email='rez-bot@users.noreply.github.com' commit -m 'csoloader: bump submodule after upstream merge'
          git push origin HEAD:bot/csoloader-merged --force
